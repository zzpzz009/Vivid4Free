# Include inside the existing app.archai.vip HTTPS server block.
# Upload the generated engine.json atomically before enabling this location.
location = /vivid-updates/engine.json {
    alias /var/www/vivid-updates/engine.json;
    default_type application/json;
    add_header Cache-Control "public, max-age=60" always;
    add_header X-Content-Type-Options nosniff always;
    limit_except GET { deny all; }
}
