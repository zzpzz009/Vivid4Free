<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050507">
  <title>Vivid4Free · 光，正在成形</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif; background: #050507; color: #f4f2f8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 280px; }
    button { font: inherit; }
    button:focus-visible { outline: 2px solid #90d7ff; outline-offset: 7px; }
    [hidden] { display: none !important; }
    .screen { position: relative; width: 100%; min-height: 100svh; overflow: hidden; background: #050507; }
    .header { position: absolute; z-index: 3; top: 38px; left: 48px; right: 48px; display: flex; align-items: center; justify-content: space-between; }
    .brand { font-size: 13px; font-weight: 600; letter-spacing: -.2px; }
    .edition { font-size: 10px; letter-spacing: 2.4px; color: #66646e; }
    .ambient { position: absolute; inset: 0; pointer-events: none; }
    .ambient::before, .ambient::after { content: ""; position: absolute; width: 660px; height: 660px; border-radius: 50%; filter: blur(100px); opacity: .075; }
    .ambient::before { background: radial-gradient(circle, #6346ef, transparent 66%); left: calc(50% - 530px); top: calc(50% - 300px); }
    .ambient::after { background: radial-gradient(circle, #c13780, transparent 66%); left: calc(50% - 60px); top: calc(50% - 250px); }
    .grain { position: absolute; inset: 0; pointer-events: none; opacity: .035; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23fff' filter='url(%23n)' opacity='.5' d='M0 0h180v180H0z'/%3E%3C/svg%3E"); }
    .intro { position: fixed; inset: 0; z-index: 10; min-height: 100svh; background: transparent; isolation: isolate; mix-blend-mode: screen; }
    .intro-backdrop { position: absolute; inset: 0; background: #000; }
    .intro-center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; transform: translateY(-18px); mix-blend-mode: screen; }
    .logo-wrap { position: relative; width: clamp(200px, 25vw, 300px); aspect-ratio: 1024 / 1043; }
    .logo-art { width: 100%; height: 100%; display: block; overflow: visible; mix-blend-mode: screen; }
    .logo-image { opacity: 0; }
    .mask-path { fill: none; stroke: white; stroke-width: 300; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
    .mask-rest { opacity: 0; }
    .wordmark { margin: 23px 0 0; font-size: clamp(26px, 3vw, 34px); font-weight: 550; letter-spacing: -1.2px; opacity: 0; }
    .wordmark span { color: #aaa5b5; font-weight: 350; }
    .tagline { margin: 15px 0 0; font-size: 11px; letter-spacing: 5px; color: #8e889a; padding-left: 5px; opacity: 0; }
    .intro-footer { position: absolute; bottom: 43px; left: 48px; right: 48px; display: flex; align-items: center; justify-content: space-between; }
    .sequence { display: flex; align-items: center; gap: 15px; color: #706b7e; font-size: 10px; letter-spacing: 2px; opacity: 0; }
    .sequence-line { width: 46px; height: 1px; background: #302a3c; overflow: hidden; }
    .sequence-line::after { content: ""; display: block; width: 100%; height: 100%; background: linear-gradient(90deg, #438aff, #e77ca2); transform: translateX(-100%); }
    .text-button { border: 0; padding: 10px 0 10px 14px; color: #8b8498; background: transparent; cursor: pointer; font-size: 11px; letter-spacing: 1px; transition: color .2s; }
    .text-button:hover { color: #fff; }
    .text-button span { display: inline-block; margin-left: 10px; }
    .playing .logo-wrap { animation: materialize 3.6s cubic-bezier(.16,1,.3,1) .15s both; }
    .playing .logo-image { animation: image-in 1.5s cubic-bezier(.2,0,.3,1) .25s both; }
    .playing .mask-path { animation: ribbon 1.95s cubic-bezier(.45,0,.2,1) .35s both; }
    .playing .mask-rest { animation: rest-in .6s ease 1.9s both; }
    .playing .wordmark { animation: type-in 1s cubic-bezier(.16,1,.3,1) 1.65s both; }
    .playing .tagline { animation: type-in 1s cubic-bezier(.16,1,.3,1) 2s both; }
    .playing .sequence { animation: type-in .8s ease .5s both; }
    .playing .sequence-line::after { animation: progress 3.5s cubic-bezier(.4,0,.2,1) .3s both; }
    @keyframes ribbon { to { stroke-dashoffset: 0; } }
    @keyframes rest-in { to { opacity: 1; } }
    @keyframes image-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes materialize { from { transform: translateY(12px) scale(.94); filter: blur(2px); } 65%, to { transform: translateY(0) scale(1); filter: blur(0); } }
    @keyframes type-in { from { opacity: 0; transform: translateY(10px); filter: blur(5px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
    @keyframes progress { to { transform: translateX(0); } }
    .landing { display: grid; place-items: center; text-align: center; padding: 120px 24px; }
    .landing-content { position: relative; z-index: 1; mix-blend-mode: screen; }
    .intro-active .landing-logo { opacity: 0; }
    .intro-active .landing .header, .intro-active .landing-footer { opacity: 0; }
    .intro-active.docking .landing .header, .intro-active.docking .landing-footer { opacity: 1; transition: opacity 1s .2s; }
    .intro-active .landing-content > :not(.landing-logo) { opacity: 0; transform: translateY(12px); }
    .intro-active.docking .landing-content > :not(.landing-logo) { opacity: 1; transform: none; transition: opacity .9s .25s, transform 1s .25s cubic-bezier(.16,1,.3,1); }
    .intro-active .landing-content > .eyebrow, .intro-active .landing-content > h1 { transform: none !important; }
    .intro-active.docking .landing-content > .eyebrow, .intro-active.docking .landing-content > h1 { opacity: 0 !important; transition: none !important; }
    .intro-active.docking .landing-content > .landing-description, .intro-active.docking .landing-content > .replay { opacity: 0 !important; }
    .docking .intro .wordmark, .docking .intro .tagline { visibility: hidden; }
    .text-flight { position: fixed; left: 0; top: 0; z-index: 11; margin: 0; padding: 0; line-height: normal; white-space: pre; pointer-events: none; }
    .flight-target { position: absolute; inset: 0; opacity: 0; background-clip: text; }
    .landing-logo { width: 100px; height: auto; overflow: visible; mix-blend-mode: screen; }
    .eyebrow { color: #9990ac; font-size: 10px; letter-spacing: 5px; margin: 28px 0 22px; font-weight: 550; }
    .eyebrow span { color: #aaa5b5; font-weight: 350; }
    .landing h1 { margin: 0; font-weight: 400; font-size: clamp(28px, 4vw, 54px); letter-spacing: -1px; line-height: 1.5; }
    .landing h1 span { background: linear-gradient(100deg, #83beff, #c38dff 45%, #f4b3bb); color: transparent; background-clip: text; }
    .landing-description { color: #80798d; font-size: 12px; letter-spacing: 2px; margin: 20px 0 38px; transition: opacity .45s; }
    .replay { display: inline-flex; gap: 12px; align-items: center; padding: 13px 22px; border-radius: 999px; border: 1px solid #ffffff20; background: #ffffff04; color: #d3cddb; font-size: 12px; cursor: pointer; transition: background .2s, border-color .2s, opacity .45s; }
    .replay:hover { background: #ffffff0c; border-color: #ffffff40; }
    .landing-footer { position: absolute; left: 48px; right: 48px; bottom: 44px; display: flex; justify-content: space-between; gap: 20px; font-size: 9px; letter-spacing: 2px; color: #625b70; }
    @media (max-width: 600px) {
      .header { top: 27px; left: 25px; right: 25px; }
      .edition { font-size: 8px; letter-spacing: 1.6px; }
      .intro-footer, .landing-footer { left: 25px; right: 25px; bottom: 28px; }
      .intro-center { transform: translateY(-12px); }
      .logo-wrap { width: 230px; max-width: 68vw; }
      .wordmark { margin-top: 25px; font-size: 30px; }
      .tagline { font-size: 10px; letter-spacing: 4px; }
      .sequence { font-size: 8px; gap: 10px; }
      .sequence-line { width: 26px; }
      .landing-footer { font-size: 8px; letter-spacing: 1px; }
    }
    @media (max-height: 550px) and (min-width: 601px) {
      .logo-wrap { width: 180px; }
      .intro-center { transform: translateY(0); }
      .wordmark { margin-top: 8px; font-size: 24px; }
      .tagline { margin-top: 10px; }
      .header { top: 22px; }
      .intro-footer { bottom: 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .playing, .playing * , .playing *::after { animation: none !important; }
      .playing .logo-image, .playing .mask-rest, .playing .wordmark, .playing .tagline, .playing .ambient, .playing .sequence { opacity: 1; }
      .playing .sequence-line::after { transform: none; }
    }
      .replay { visibility: hidden !important; }
    .landing-footer { visibility: hidden !important; }
  </style>
</head>
